  try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved){
    opening.hidden = false;
    open(b64(saved)).then(function(ok){ if(!ok){ try{ localStorage.removeItem(KEY); }catch(e){} showForm("The password has changed. Please enter the new one."); } })
      .catch(function(){ showForm(); });
  } else showForm();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var pw = document.getElementById("pw").value, btn = document.getElementById("go");
    if(!pw) return;
    btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
    derive(pw).then(function(bits){
      var rem = document.getElementById("rem").checked;
      return open(bits).then(function(ok){
        if(ok){ if(rem){ try{ localStorage.setItem(KEY, tob64(bits)); }catch(e){} } return; }
        btn.disabled = false; btn.textContent = "Open"; err.textContent = "That password isn't right. Check the spelling and dashes.";
      });
    }).catch(function(){ btn.disabled = false; btn.textContent = "Open"; err.textContent = "Something went wrong. Please try again."; });
  });
})();
</script>
