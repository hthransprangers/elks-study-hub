    }).then(function(bits){ return new Uint8Array(bits); });

  function open(bits){
    var iv = b64(D.iv), ct = b64(D.ct), data = new Uint8Array(iv.length + ct.length);
    data.set(iv); data.set(ct, iv.length);
    return crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]).then(function(mk){
      return crypto.subtle.verify("HMAC", mk, b64(D.tag), data);
    }).then(function(ok){
      if(!ok) return false;
      return crypto.subtle.importKey("raw", bits.slice(0,32), {name:"AES-CBC"}, false, ["decrypt"]).then(function(ek){
        return crypto.subtle.decrypt({name:"AES-CBC", iv:iv}, ek, ct);
      }).then(function(pt){
        var html = new TextDecoder().decode(pt);
        // Replace the page only after the password screen has fully finished loading.
        // (If it's still loading, document.open() is ignored and the two pages get mixed together.)
        var swap = function(){ document.open(); document.write(html); document.close(); };
        if(document.readyState === "complete") setTimeout(swap, 0);
        else window.addEventListener("load", function(){ setTimeout(swap, 0); }, {once:true});
        return true;
      });
    });
  }
  function showForm(msg){ opening.hidden = true; form.hidden = false; err.textContent = msg || ""; document.getElementById("pw").focus(); }

  if(!window.crypto || !crypto.subtle){ showForm("This browser can't open the study hub. Try updating it, or use Safari or Chrome."); document.getElementById("go").disabled = true; return; }
  var saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved){
    opening.hidden = false;
    open(b64(saved)).then(function(ok){ if(!ok){ try{ localStorage.removeItem(KEY); }catch(e){} showForm("The password has changed. Please enter the new one."); } })
      .catch(function(){ showForm(); });
  } else showForm();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var pw = document.getElementById("pw").value, btn = document.getElementById("go");
    if(!pw) return;
    btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
    derive(pw).then(function(bits){
      var rem = document.getElementById("rem").checked;
      return open(bits).then(function(ok){
        if(ok){ if(rem){ try{ localStorage.setItem(KEY, tob64(bits)); }catch(e){} } return; }
        btn.disabled = false; btn.textContent = "Open"; err.textContent = "That password isn't right. Check the spelling and dashes.";
      });
    }).catch(function(){ btn.disabled = false; btn.textContent = "Open"; err.textContent = "Something went wrong. Please try again."; });
  });
})();
</script>
