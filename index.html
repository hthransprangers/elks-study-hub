  var KEY = "hub.unlock";
  var b64 = function(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; };
  var tob64 = function(u){ var s = ""; for(var i=0;i<u.length;i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var norm = function(p){ return p.trim().toLowerCase().replace(/\s+/g, ""); };

  function derive(pw){
    var enc = new TextEncoder().encode(norm(pw));
    return crypto.subtle.importKey("raw", enc, "PBKDF2", false, ["deriveBits"]).then(function(base){
      return crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(D.salt), iterations:D.it, hash:"SHA-256"}, base, 512);

  function open(bits){
    var iv = b64(D.iv), ct = b64(D.ct), data = new Uint8Array(iv.length + ct.length);
